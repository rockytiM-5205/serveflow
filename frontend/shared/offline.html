<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#064e3b">
  <title>You're offline · ServeFlow</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; box-sizing: border-box; font: 16px/1.5 system-ui, sans-serif; color: #14201b; background: #f4f7f5; text-align: center; }
    main { max-width: 26rem; }
    h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
    p { margin: 0 0 1.25rem; color: #46564e; }
    button { min-height: 2.75rem; padding: 0 1.25rem; border: 0; border-radius: .6rem; background: #064e3b; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>You're offline</h1>
    <p>ServeFlow needs the internet to show and take orders, so nothing is shown from an old copy. Check your connection and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
